name: Refresh Google Scholar citations

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Verify refresh safeguards
        run: python3 -B -m unittest discover -s tests -v
      - name: Read verified Scholar counts
        id: scholar
        run: python3 scripts/update_scholar.py --skip-if-current --defer-if-blocked
      - name: Render both language editions
        if: steps.scholar.outputs.status == 'refreshed'
        run: python3 scripts/build.py
      - name: Save the snapshot and request a Pages build
        if: steps.scholar.outputs.status == 'refreshed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- data/scholar.json index.html zh/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Google Scholar citation counts"
          git push origin HEAD:main
          # Branch publishing can start a build on its own. Request one if it hasn't.
          revision=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            built=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq 'select(.status != "errored") | .commit' || true)
            if [ "$built" = "$revision" ]; then
              exit 0
            fi
            sleep 3
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
